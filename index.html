<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Descent — Art Portfolio</title>
    <meta name="description" content="An art portfolio structured as a descent through circles." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts: Cinzel, Cormorant Garamond, Jost -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Jost:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="js/main.js"></script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- LOADING SCREEN -->
    <div id="loader" class="loader" aria-hidden="true">
      <img src="assets/falling-man.png" alt="Falling character" class="diver-img" />
    </div>
    <!-- ambient background layer, sits behind everything, shared by all sections -->
    <div class="atmosphere" aria-hidden="true">
      <div class="bg-photo"></div>
      <div class="vignette"></div>
      <div class="grain"></div>

      <!-- lava canyon — two jagged rock walls, full height, converging toward
       a lava river at the bottom, per the reference photo -->
      <svg class="canyon" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice">
        <path
          class="canyon__rock"
          d="M0,900 L0,250 L50,300 L90,220 L140,270 L180,190 L230,240 L270,160
      L320,210 L360,140 L410,200 L450,260 L430,340 L470,300 L440,400 L480,380 L450,470 L500,450
      L470,540 L520,520 L490,610 L540,600 L510,700 L560,690 L540,800 L600,850 L620,900 Z"
        />
        <path
          class="canyon__rock"
          d="M1440,900 L1440,250 L1390,300 L1350,220 L1300,270 L1260,190 L1210,240 L1170,160
      L1120,210 L1080,140 L1030,200 L990,260 L1010,340 L970,300 L1000,400 L960,380 L990,470 L940,450
      L970,540 L920,520 L950,610 L900,600 L930,700 L880,690 L900,800 L840,850 L820,900 Z"
        />

        <!-- small distant peaks visible through the fog, between the two walls -->
        <path
          class="canyon__far-peaks"
          d="M480,430 L560,330 L610,400 L680,300 L740,390 L800,300 L860,400 L900,440 L900,900 L480,900 Z"
        />

        <!-- lava veins climbing the left wall -->
        <path class="canyon__lava" d="M300,220 L280,270 L310,320 L275,380 L305,430 L265,490" />
        <path
          class="canyon__lava"
          d="M420,260 L400,330 L435,390 L405,450 L440,510 L410,580 L445,650 L420,720 L455,790 L470,900"
        />
        <path class="canyon__lava" d="M180,300 L165,360 L195,420 L160,480 L190,540 L155,610" />
        <path class="canyon__lava" d="M470,470 L505,530 L480,600 L515,670 L495,740 L530,900" />

        <!-- lava veins climbing the right wall -->
        <path
          class="canyon__lava"
          d="M1140,220 L1160,270 L1130,320 L1165,380 L1135,430 L1175,490"
        />
        <path
          class="canyon__lava"
          d="M1020,260 L1040,330 L1005,390 L1035,450 L1000,510 L1030,580 L995,650 L1020,720 L985,790 L970,900"
        />
        <path
          class="canyon__lava"
          d="M1260,300 L1275,360 L1245,420 L1280,480 L1250,540 L1285,610"
        />
        <path class="canyon__lava" d="M970,470 L935,530 L960,600 L925,670 L945,740 L910,900" />

        <!-- the lava river at the canyon floor -->
        <path class="canyon__river" d="M560,900 L600,850 L680,880 L760,840 L840,880 L900,900" />
      </svg>

      <!-- warm haze rising off the lava, blending into the cool fog above it -->
      <div class="haze"></div>

      <!-- fog banks drifting over the peaks -->
      <div class="fog fog--1"></div>
      <div class="fog fog--2"></div>
      <div class="fog fog--3"></div>
      <div class="fog fog--4"></div>

      <div class="lava-glow lava-glow--left"></div>
      <div class="lava-glow lava-glow--right"></div>
      <div class="lava-glow lava-glow--center"></div>

      <div class="scrim"></div>

      <div class="embers" id="embers"></div>
    </div>

    <!-- section progress rail — also doubles as click-to-jump navigation -->
    <nav class="rail" aria-label="Section navigation">
      <button class="rail__dot is-active" data-index="0" aria-label="Go to opening"></button>
      <button class="rail__dot" data-index="1" aria-label="Go to the map"></button>
      <button class="rail__dot" data-index="2" aria-label="Go to credits"></button>
    </nav>

    <main id="scroll-track">
      <!-- SECTION 0 — HERO -->
      <section class="panel panel--hero" id="panel-0">
        <div class="hero-layer hero-sky" style="background-image: url('assets/bg-sky.jpg')"></div>
        <div
          class="hero-layer hero-clouds hero-clouds--left"
          style="background-image: url('assets/clouds-left.png')"
        ></div>
        <div
          class="hero-layer hero-clouds hero-clouds--right"
          style="background-image: url('assets/clouds-right.png')"
        ></div>

        <div class="hero-title-wrap">
          <p class="eyebrow">Interactive Visualization</p>
          <h1 class="hero-title">Dante’s Inferno</h1>
          <p class="hero-desc desc-first">Lasciate ogni speranza, voi ch’entrate.</p>
          <p class="hero-desc desc-second">Abandon all hope, you who enter here.</p>

          <button class="scroll-hint" onclick="next()" aria-label="Scroll to the map">
            <span>ENTER</span>
            <svg width="14" height="20" viewBox="0 0 14 20">
              <path
                d="M7 0 V17 M1 11 L7 17 L13 11"
                stroke="currentColor"
                fill="none"
                stroke-width="1.4"
              />
            </svg>
          </button>
        </div>
      </section>

      <!-- SECTION 1 — MAP -->
      <section class="panel panel--map" id="panel-1">
        <div class="map-frame">
          <img class="map-bg" src="assets/map/map.gif" alt="The nine circles, cross-section" />

          <svg
            class="map-svg"
            viewBox="0 0 1000 562"
            preserveAspectRatio="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <!-- 
       path
      -->
            <path
              class="map-area"
              data-index="0"
              d="M195.5 96C207.5 138 829.5 136 833 94.5C827.5 57 216.5 50 195.5 96Z"
            />
            <path
              class="map-area"
              data-index="1"
              d="M828.5 103C743 134 314.5 137 201.5 104.5L231 149L347 163.5C344.6 165.1 686.5 176.5 797.5 148.5L798.615 147.199C812.731 130.736 817.29 125.42 828.5 103Z"
            />
            <path
              class="map-area"
              data-index="2"
              d="M795.5 150C757.5 166 346.5 176.5 233.5 151C250 175.5 255.5 185.5 261 197C381 219.5 723 209 769.5 196C775 186.5 782.5 174 795.5 150Z"
            />
            <path
              class="map-area"
              data-index="3"
              d="M768.5 197C627 216 436 216 262.5 198C269 210.5 285.5 237 287.5 241C363.5 259.5 698 256.5 742 241C750.5 228 762.5 210.5 768.5 197Z"
            />
            <path
              class="map-area"
              data-index="4"
              d="M742 241C681 257 412 263 287.5 241C296 258 307.5 276.5 312.5 288.5C443 301.5 612 302 716 287.5C723 277 736 256.5 742 241Z"
            />
            <path
              class="map-area"
              data-index="5"
              d="M715.5 289C616 302 442 306 313.5 287.5C321.88 304.26 334.634 322.478 341.7 332.571L342 333C460 342.5 583.5 346.5 689.5 331.5C696.5 321 709 305 715.5 289Z"
            />
            <path
              class="map-area"
              data-index="6"
              d="M689 332C623 344.5 411.5 343.5 343 334C351.5 351 362 366 369 376C411 387.5 609.5 390.5 660.5 376C667.5 365.5 680 348.5 689 332Z"
            />
            <path
              class="map-area"
              data-index="7"
              d="M660.5 377C592.5 390 437.5 388.5 368.5 377C379.5 393.5 401 430 410.5 444C479 424 562 423 618.5 442C626 431.5 650 393.5 660.5 377Z"
            />
            <path
              class="map-area"
              data-index="8"
              d="M618.5 443.03C567.5 424.53 469 423.474 411 444.974C453 511.974 453 526.088 465.5 538.088C507 553.088 527.5 556.088 567.5 535.588C575 525.088 574 519.471 618.5 443.03Z"
            />
          </svg>
        </div>
      </section>

      <!-- SECTION 2 — CREDITS -->
      <section class="panel panel--credits" id="panel-2">
        <p class="eyebrow">FIN</p>
        <h2 class="credits-title">CREDITS</h2>
        <ul class="credits-list" data-editable="credits-list">
          <li><span>Art &amp; Direction</span><span>Kimia Borjian</span></li>
          <li><span>Built With</span><span>HTML, CSS, JavaScript</span></li>
          <li><span>Inspired By</span><span>Dante's Inferno</span></li>
        </ul>
      </section>
    </main>

    <!-- FULLSCREEN VIEWER — opens when a ring is clicked -->
    <div class="viewer" id="viewer" aria-hidden="true">
      <div class="viewer__media" id="viewer-media"></div>
      <div class="viewer__scrim"></div>
      <button class="viewer__close" id="viewer-close" aria-label="Close">
        <svg width="22" height="22" viewBox="0 0 22 22">
          <path d="M2 2 L20 20 M20 2 L2 20" stroke="currentColor" stroke-width="2" />
        </svg>
      </button>
      <div class="viewer__panel">
        <p class="viewer__eyebrow" id="viewer-eyebrow"></p>
        <h3 class="viewer__title" id="viewer-title"></h3>
        <p class="viewer__desc" id="viewer-desc"></p>
      </div>
    </div>

    <script src="js/main.js"></script>
  </body>
</html>
